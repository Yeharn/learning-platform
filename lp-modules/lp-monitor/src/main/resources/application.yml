# @Version: 1.0.0
# @Description: 监控服务主配置：端口、数据源、接口文档

server:
  port: 9202

spring:
  application:
    name: lp-monitor
  # 环境由 Maven profile 打包时注入：mvn package -P dev|test|prod
  profiles:
    active: @profiles.active@
  jackson:
    time-zone: GMT+8

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-cookie: false
  is-read-header: true
  is-log: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.yeharn.lp: info
# Eureka 注册中心（Spring Cloud Netflix）
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_ADDR:http://127.0.0.1:8849/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30