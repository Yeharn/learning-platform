# @Description: 定时任务服务配置文件（生产环境）

# 线上生产环境（按实际地址修改，或使用环境变量覆盖）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${LP_DB_HOST:prod-mysql}:3306/learning_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${LP_DB_USER:root}
    password: ${LP_DB_PASSWORD:MySQL@ZnSoft}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${LP_REDIS_HOST:prod-redis}
      port: ${LP_REDIS_PORT:6379}
      password: ${LP_REDIS_PASSWORD:Redis@ZnSoft}
      database: 0
      timeout: 5000ms

lp:
  job:
    # 生产环境调度线程池与日志保留期
    pool-size: 16
    log-retain-days: 60

logging:
  level:
    org.yeharn.lp: info
    root: warn
